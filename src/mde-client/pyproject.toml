[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mde-client"
version = "0.2.2"
description = "Python client for the Microsoft Defender for Endpoint API with lazy results and Arrow/Polars output."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Proxay", email = "28168887+ProxayFox@users.noreply.github.com" },
]
keywords = [
    "microsoft-defender",
    "defender-for-endpoint",
    "mde",
    "security",
    "edr",
    "msal",
    "arrow",
    "polars",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.14.1",
    "http-to-arrow>=0.2.1",
    "httpx>=0.28.1",
    "msal>=1.37.0",
    "orjson>=3.11.9",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
]

[project.optional-dependencies]
arrow = [
    "pyarrow>=24.0.0",
]
polars = [
    "polars>=1.42.1",
]

[project.urls]
Homepage = "https://github.com/ProxayFox/pysec-clients"
Source = "https://github.com/ProxayFox/pysec-clients/tree/main/src/mde-client"
Issues = "https://github.com/ProxayFox/pysec-clients/issues"
Documentation = "https://proxayfox.github.io/pysec-clients"
Changelog = "https://github.com/ProxayFox/pysec-clients/blob/main/src/mde-client/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mde_client = ["py.typed"]
