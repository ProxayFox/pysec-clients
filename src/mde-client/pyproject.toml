[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mde-client"
version = "0.1.0"
description = "Python client for the Microsoft Defender for Endpoint API with lazy results and Arrow/Polars output."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Proxay", email = "28168887+ProxayFox@users.noreply.github.com" },
]
keywords = [
    "microsoft-defender",
    "defender-for-endpoint",
    "mde",
    "security",
    "edr",
    "msal",
    "arrow",
    "polars",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.13.5",
    "http-to-arrow>=0.1.2",
    "msal>=1.36.0",
    "orjson>=3.10.18",
    "requests>=2.33.1",
]

[project.optional-dependencies]
arrow = ["pyarrow>=24.0.0"]
polars = ["polars>=1.40.1"]

[project.urls]
Homepage = "https://github.com/ProxayFox/pysec-clients"
Source = "https://github.com/ProxayFox/pysec-clients/tree/main/src/mde-client"
Issues = "https://github.com/ProxayFox/pysec-clients/issues"
Documentation = "https://github.com/ProxayFox/pysec-clients/blob/main/src/mde-client/README.md"
Changelog = "https://github.com/ProxayFox/pysec-clients/blob/main/src/mde-client/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mde_client = ["py.typed"]
