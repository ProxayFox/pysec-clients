name: Refresh MDE Canonical Contracts

on:
  schedule:
    - cron: "0 3 * * 1"   # Every Monday at 03:00 UTC
  workflow_dispatch:        # Allow manual trigger from the Actions tab

permissions:
  contents: write
  pull-requests: write

env:
  # Opt into Node.js 24 for JavaScript-based actions ahead of the
  # 2026-06-16 deprecation of Node.js 20 on GitHub Actions runners.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  refresh-contracts:
    name: Refresh metadata and canonical contract projections
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install dependencies
        run: uv sync --all-packages --all-groups --frozen

      - name: Fetch upstream metadata snapshot
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: uv run scripts/fetch_mde_metadata.py

      - name: Regenerate canonical contracts
        run: just contracts-generate

      - name: Validate generated projections
        run: just quality-contracts

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/mde-contract-refresh
          delete-branch: true
          commit-message: "chore(contracts): refresh MDE source contracts"
          title: "chore(contracts): refresh MDE source contracts"
          body: |
            Automated weekly refresh of the canonical MDE source contracts and
            their PyArrow and JSON Schema projections.

            **Triggered by:** ${{ github.event_name == 'schedule' && 'weekly schedule' || 'manual dispatch' }}
            **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ---
            Review the upstream metadata and override diffs, confirm the
            recommended semantic-version bumps in
            `tools/mde-contract-gen/versions.json`, and verify Arrow parity
            before merging.
          labels: |
            automated
            contracts
