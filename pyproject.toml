[project]
name = "pysec-clients"
version = "0.1.0"
description = "Monorepo for security vendor API clients, e.g. Defender, CrowdStrike, Tenable, and more to come."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Proxay", email = "28168887+ProxayFox@users.noreply.github.com" },
]
requires-python = ">=3.14"
dependencies = [
    "mde-client[arrow,polars]",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "checkov>=3.1.47",
    "deptry>=0.25.1",
    "polars>=1.41.2",
    "pre-commit>=4.5.1",
    "psutil>=7.2.2",
    "pyarrow>=24.0.0",
    "pyarrow-stubs>=20.0.0.20251215",
    "pyinstrument>=5.1.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.11",
    "scalene>=2.2.1",
    "ty>=0.0.32",
    "types-defusedxml>=0.7.0.20260408",
    "types-pyyaml>=6.0.12.20260408",
    "vulture>=2.16",
]
docs = [
    "mike>=2.2.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocs-section-index>=0.3.10",
    "mkdocstrings[python]>=0.30.1",
    "pymdown-extensions>=10.21.2",
]

[tool.uv.workspace]
members = ["src/*"]

[tool.uv.sources]
mde-client = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["scripts"]
markers = [
    "integration: live API integration tests (require Azure credentials)",
]

[tool.coverage.run]
branch = true
source = ["mde_client"]
omit = [
    "*/schemas/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
    "pragma: no cover",
]

[tool.ty.environment]
python = "./.venv"
root = ["./src/mde-client/src", "./tests", "./scripts"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests", "scripts"]
extraPaths = ["src/mde-client/src", "scripts"]

[tool.ruff.lint.per-file-ignores]
# These modules predate the lint rule and are part of the established package
# import surface; renaming them would be a breaking API change.
"src/mde-client/src/mde_client/endpoints/__init__.py" = ["RUF022"]
"src/mde-client/src/mde_client/endpoints/authenticatedScan.py" = ["N999"]
"src/mde-client/src/mde_client/endpoints/browserExtension.py" = ["N999"]
"src/mde-client/src/mde_client/endpoints/certificateInventory.py" = ["N999"]
"src/mde-client/src/mde_client/endpoints/deviceAvHealth.py" = ["N999"]
"src/mde-client/src/mde_client/endpoints/deviceGroups.py" = ["N999"]
"src/mde-client/src/mde_client/endpoints/machineActions.py" = ["N999"]
"src/mde-client/src/mde_client/endpoints/securityBaseline.py" = ["N999"]
"src/mde-client/src/mde_client/viaFiles.py" = ["N999"]
