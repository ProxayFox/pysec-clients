site_name: pysec-clients
site_description: Documentation for pysec-clients and its package surfaces.
site_url: https://proxayfox.github.io/pysec-clients/
repo_name: ProxayFox/pysec-clients
repo_url: https://github.com/ProxayFox/pysec-clients
edit_uri: edit/main/docs/
docs_dir: docs
theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
plugins:
  - search
  - section-index
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - src/mde-client/src
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            filters:
              - "!^_"
              - "!^model_config$"
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
nav:
  - Home: index.md
  - MDE Client:
      - Overview: mde_client/index.md
      - Tutorials:
          - Get started: mde_client/tutorials/get-started.md
      - How-to guides:
          - Index: mde_client/how-to/index.md
          - Authenticate with client credentials: mde_client/how-to/authenticate-with-client-credentials.md
          - List and filter machines: mde_client/how-to/list-and-filter-machines.md
          - Get related data for one machine: mde_client/how-to/get-machine-related-data.md
          - Run an advanced hunting query: mde_client/how-to/run-advanced-hunting.md
          - Work with result formats: mde_client/how-to/work-with-result-formats.md
          - Stream results as Arrow IPC: mde_client/how-to/stream-ipc-results.md
          - Use export-backed endpoints: mde_client/how-to/use-export-backed-endpoints.md
          - Inject a custom HTTP client or token cache: mde_client/how-to/inject-http-client-and-token-cache.md
          - Handle errors and retries: mde_client/how-to/handle-errors-and-retries.md
          - Tune performance: mde_client/how-to/tune-performance.md
